[package]
name = "tauri-app"
version = "1.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
lofty = "0.21"
symphonia = { version = "0.5.4", features = ["all"] }
rodio = "0.19"
tauri-plugin-dialog = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = [
  "blocking", "json", "stream", "charset", "http2", "system-proxy", "rustls-no-provider",
] }
# ADR-1(MA0)：reqwest 0.13 默认的 rustls 后端是 aws-lc-rs，其 C 依赖（aws-lc-sys）
# 交叉编译 Android 需要 cmake/目标 C 工具链，不可用；改为进程内安装 ring 后端（纯 Rust）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
quick-xml = { version = "0.40.1", features = ["serialize"] }
chrono = "0.4.45"
url = "2.5.8"
thiserror = "2.0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
base64 = "0.22"
rand = "0.10.2"

# Android 专属：cpal/oboe 音频栈依赖 ndk_context 上下文（见 lib.rs JNI 导出）
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
