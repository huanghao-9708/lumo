name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # I1/QA-001：发布前门禁——产物只能由"通过同等 CI 检查的 commit"产生。
  # 不打这层的话，任何人推一个 tag 就能绕过 CI 直接对外发布安装包。
  preflight:
    name: 发布前门禁（版本一致 / tag 匹配 / 质量检查）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust stable（含 rustfmt / clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          work-dir: ./src-tauri

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      # tag 必须指向 package.json 的版本，否则 Release 标题/文件名与实际代码版本会错位。
      # workflow_dispatch 手动补发时无 tag，只校验三处版本一致。
      - name: 版本号三处一致
        run: node scripts/check-versions.mjs

      - name: tag 与版本匹配
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "tag \"$GITHUB_REF_NAME\" 与代码版本 \"$EXPECTED\" 不一致，拒绝发布。" >&2
            exit 1
          fi

      - name: 联网行为登记（主机级白名单 + 调用点行为 ID）
        run: node scripts/check-network-registry.mjs

      - name: 前端类型检查 + 单元测试 + 构建
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
          npm run build

      - name: Rust 格式检查
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: 严格静态检查（告警即失败）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        working-directory: src-tauri
        run: cargo test

  publish-tauri:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    # 预发布 tag（v*-beta.N）判定，供通道隔离与 Windows 打包目标两处复用。
    # env 里的布尔会被转成字符串，比较时写 == 'true'。
    env:
      IS_PRERELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          work-dir: ./src-tauri

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Lumo v__VERSION__
          releaseBody: Lumo music player release. Download the installer for your platform below.
          releaseDraft: false
          # 通道隔离（VERSION_POLICY §2）：预发布 tag（v*-beta.N）必须在 GitHub 上标成 prerelease，
          # 否则它会成为 /releases/latest 的返回值，被应用内更新检查（MobileSettings.vue 的
          # releases/latest）当成 Stable 推给全部用户。稳定 tag 仍为 false。
          prerelease: ${{ env.IS_PRERELEASE_TAG == 'true' }}
          # MSI（WiX）要求预发布标识符是纯数字且 ≤65535，`1.8.2-beta.N` 直接打回构建，
          # 所以 Beta tag 下 Windows 只出 NSIS 安装包；稳定 tag 仍按 bundle targets 全出。
          args: ${{ matrix.platform == 'windows-latest' && env.IS_PRERELEASE_TAG == 'true' && '--bundles nsis' || matrix.args }}

  publish-android:
    needs: publish-tauri
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # G-22：v3 默认要装 Google 已下架的 `tools` 包，sdkmanager 直接 exit 1。
      # v4 默认只装 platform-tools（显式请求 tools 也只告警跳过），CI 侧无需其他改动。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Remove local Windows gradle.java.home
        run: |
          sed -i '/org.gradle.java.home/d' src-tauri/gen/android/gradle.properties

      # [Android 签名] keystore 与 key.properties 仅存于 Secrets，打 tag 构建时还原，
      # gen/android/app/build.gradle.kts 的 release signingConfig 自动生效。
      # storeFile 相对 app 模块目录（../lumo-release.keystore = gen/android/ 下）。
      - name: Restore signing keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/lumo-release.keystore

      - name: Write key.properties for signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > src-tauri/gen/android/key.properties <<EOF
          storeFile=../lumo-release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Install frontend dependencies
        run: npm install

      - name: Build Android APK
        run: npm run tauri android build -- --target aarch64 --apk

      - name: Collect and Rename APKs
        id: collect-apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          fi
          mkdir -p release-apks
          find src-tauri/gen/android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} release-apks/ \;
          cd release-apks
          for f in *.apk; do
            mv "$f" "Lumo-v${VERSION}-arm64-$f" || true
          done
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt
